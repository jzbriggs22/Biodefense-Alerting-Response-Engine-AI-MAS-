\* TLC Model Checking Configuration for biodefense.tla
\*
\* Run with: java -jar tla2tools.jar -config biodefense.cfg biodefense.tla

CONSTANTS
    Agents = {"osint", "sensor", "epi"}
    MaxCertainty = 10
    QuorumSize = 2
    EscThresholdElevated = 3
    EscThresholdSuspected = 6
    EscThresholdConfirmed = 8
    DeescThresholdElevated = 2
    DeescThresholdSuspected = 4
    DeescThresholdConfirmed = 6
    MinAgreement = 60

SPECIFICATION Spec

INVARIANT Safety
INVARIANT TypeInvariant
INVARIANT SafeModeBlocksEscalation
INVARIANT UncertaintySurfaced
INVARIANT CertaintyBounded
